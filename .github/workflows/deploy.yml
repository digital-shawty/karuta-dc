# Builds the site and publishes it to GitHub Pages.
#
# Pages serves whatever this uploads, so without it the repository itself is
# what gets served, and a repository with no index.html falls back to showing
# the README. That is the whole reason this file exists.
#
# One-off setting, in the repository: Settings -> Pages -> Source -> GitHub
# Actions. Until that is switched over, Pages keeps serving the branch and
# this workflow's output is ignored.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes one that is queued, but never interrupts a run
# already part-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The generator's maths is checked before anything is published, so a
      # broken layout or frame matcher never reaches the live site.
      - run: npm run check:cardgen

      - run: npm run generate
        env:
          # The site lives at https://digital-shawty.github.io/karuta-dc/, not
          # at the domain root, so every asset URL has to carry that prefix.
          # Rename the repository and this line changes with it.
          NUXT_APP_BASE_URL: /karuta-dc/
          # Writes .nojekyll. Without it Pages runs the output through Jekyll,
          # which hides every directory starting with an underscore, _nuxt
          # included, and the site loads with no CSS or JavaScript at all.
          NITRO_PRESET: github_pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
