# Builds the site and publishes it to the gh-pages branch.
#
# Pages serves a branch of this repository, so it has to be given a branch
# that is a website. Main is not one: it holds the source, and a branch with
# no index.html at its root is run through Jekyll, which renders the README
# instead. So the site is built here and pushed to gh-pages, which exists for
# nothing else.
#
# One-off setting, in the repository: Settings -> Pages -> Source -> Deploy
# from a branch -> gh-pages / (root). Until that is pointed at gh-pages, Pages
# keeps serving main and this workflow's output is ignored.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes one that is queued, but never interrupts a run
# already part-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

# Only to push the built site. This workflow watches main, and nothing here
# pushes to main, so publishing cannot set it off again.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The generator's maths is checked before anything is published, so a
      # broken layout or frame matcher never reaches the live site.
      - run: npm run check:cardgen

      - run: npm run generate
        env:
          # The site lives at https://digital-shawty.github.io/karuta-dc/, not
          # at the domain root, so every asset URL has to carry that prefix.
          # Rename the repository and this line changes with it.
          NUXT_APP_BASE_URL: /karuta-dc/
          # Writes .nojekyll. Without it Pages runs the branch through Jekyll,
          # which hides every directory starting with an underscore, _nuxt
          # included, and the site loads with no CSS or JavaScript at all.
          NITRO_PRESET: github_pages

      # One orphan commit per deploy, force pushed: gh-pages is output, so its
      # history is worth nothing and is not worth carrying. The repository is
      # never checked out here, and `git add -A` from inside the built site
      # takes the dotfiles with it, .nojekyll above all.
      - name: Publish to gh-pages
        working-directory: .output/public
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
